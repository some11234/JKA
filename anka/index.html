<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Joseph Kerby Anderson</title>
<meta name="theme-color" content="#0B0B0B">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/core/favicon.png" type="image/png" sizes="500x500">

<link rel="preconnect" href="https://api.fontshare.com">
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f%5B%5D=satoshi@1,2&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400..700&display=swap">

<link rel="stylesheet" href="/css/styles.css">
<script>document.documentElement.classList.replace('no-js', 'js');</script>
<style>
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  .site-header--short::before { height: calc(var(--header-h) + 24px); }

  .ak { position: fixed; inset: 0; margin: 0; }
  .ak__photo { width: 100%; height: 100%; max-width: none; object-fit: cover; object-position: 40% 50%; }
  .ak::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 80% 55% at 50% 52%, rgba(11, 11, 11, 0.55) 0%, rgba(11, 11, 11, 0.25) 60%, rgba(11, 11, 11, 0.1) 100%);
  }

  .ak__center {
    position: absolute; z-index: 1; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(24px, 5vh, 44px); padding: calc(var(--header-h) + 16px) 24px 24px;
    text-align: center;
  }
  .ak__title {
    margin: 0; font-family: var(--font-sans); font-weight: 700; color: var(--ink-100);
    font-size: clamp(2.8rem, 10vw, 7.5rem); line-height: 1.02; letter-spacing: -0.03em;
    text-wrap: balance; text-shadow: 0 2px 30px rgba(0, 0, 0, 0.55);
  }
  .ak__btn {
    padding: 14px 30px; font-size: clamp(0.95rem, 2.4vw, 1.1rem); letter-spacing: 0.02em;
    background: rgba(11, 11, 11, 0.35); border-color: var(--ink-70);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  .ak__btn:hover { background: rgba(255, 255, 255, 0.14); border-color: var(--ink-100); }
  .ak__hint {
    margin: calc(-1 * clamp(10px, 2.5vh, 26px)) 0 0; font-size: clamp(0.85rem, 2.2vw, 0.95rem);
    color: rgba(255, 255, 255, 0.9); text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8), 0 1px 14px rgba(0, 0, 0, 0.7);
  }
</style>
</head>
<body>

<header class="site-header site-header--short">
  <div class="site-header__row">
    <a class="site-header__home" href="/">
      <img class="site-header__logo" src="/assets/core/logo.svg" alt="Joseph Kerby — home">
    </a>
    <nav class="site-nav" aria-label="Primary">
      <a href="/#about">About</a>
      <a href="/gallery/">Gallery</a>
      <a href="/passport/">Passport</a>
    </nav>
    <a class="pill pill--accent" href="mailto:hello@josephkerby.com">Email</a>
  </div>
</header>

<main class="ak">
  <img class="ak__photo" src="photo.jpg" alt="">
  <div class="ak__center">
    <h1 class="ak__title">Happy Birthday Anka!</h1>
    <a class="pill pill--ghost ak__btn" href="https://ankaalarcon.com">ankaalarcon.com</a>
    <p class="ak__hint">Hint: use ur personal email to login</p>
  </div>
</main>

</body>
</html>
