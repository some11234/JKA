<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel — Joseph Kerby Anderson</title>
<meta name="description" content="Every country Joe has visited so far, on a globe you can spin.">
<meta name="theme-color" content="#0B0B0B">
<meta name="color-scheme" content="dark">

<!-- TODO(JOE): UNLISTED FOR NOW. This page is live at /travel/ but deliberately
     missing from the nav on every page, and this tag keeps search engines from
     surfacing it early. When it's ready: delete this line, and add
       <a href="/travel/">Travel</a>
     to .site-nav on each page (with aria-current="page" on this one). -->
<meta name="robots" content="noindex">

<meta property="og:type" content="website">
<meta property="og:url" content="https://josephkerby.com/travel/">
<meta property="og:title" content="Travel — Joseph Kerby Anderson">
<meta property="og:description" content="Every country Joe has visited so far, on a globe you can spin.">
<meta property="og:image" content="https://josephkerby.com/assets/core/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Travel — Joseph Kerby Anderson">
<meta name="twitter:description" content="Every country Joe has visited so far, on a globe you can spin.">
<meta name="twitter:image" content="https://josephkerby.com/assets/core/og.jpg">

<link rel="icon" href="/assets/core/favicon.png" type="image/png" sizes="500x500">

<link rel="preconnect" href="https://api.fontshare.com">
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f%5B%5D=satoshi@1,2&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400..700&display=swap">

<!-- The globe's outlines. Fetched by travel.js, but asked for here so the
     download starts alongside the scripts instead of after them. -->
<link rel="preload" href="/assets/travel/countries.json" as="fetch" crossorigin>

<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/travel.css">
<script>document.documentElement.classList.replace('no-js', 'js');</script>
</head>
<body>

<header class="site-header">
  <div class="site-header__row">
    <a class="site-header__home" href="/">
      <img class="site-header__logo" src="/assets/core/logo.svg" alt="Joseph Kerby — home">
    </a>
    <nav class="site-nav" aria-label="Primary">
      <a href="/#about">About</a>
      <a href="/gallery/">Gallery</a>
      <a href="/resources/">Resources</a>
    </nav>
    <a class="pill pill--accent" href="mailto:hello@josephkerby.com">Email</a>
  </div>
</header>

<!-- The cards, the counts and the pins are all built by js/travel.js from
     js/travel-data.js. Nothing to hand-edit here when you visit somewhere new —
     add it to the data file instead. -->
<main class="trv">
  <div class="trv-layout">

    <div class="trv-head">
      <h1>Travel</h1>
      <div class="trv-copy" data-travel-intro></div>
      <dl class="trv-stats" data-travel-stats></dl>
    </div>

    <!-- Sticky beside the list on wide screens; sticky behind it on phones,
         with the cards scrolling over the top. -->
    <div class="trv-stage" data-travel-stage>
      <div class="trv-globe" data-globe>
        <canvas class="trv-globe__canvas" aria-hidden="true"></canvas>
        <div class="trv-globe__pins" data-globe-pins aria-hidden="true"></div>
        <div class="trv-tip" data-globe-tip aria-hidden="true" hidden>
          <p class="trv-tip__name" data-globe-tip-name></p>
          <p class="trv-tip__sub mono" data-globe-tip-sub></p>
        </div>
        <p class="trv-globe__hint mono" data-globe-hint aria-hidden="true">Drag to spin</p>
      </div>
      <div class="trv-bar mono" aria-hidden="true">
        <ul class="trv-legend" data-globe-legend></ul>
        <p class="trv-readout" data-globe-readout></p>
      </div>
    </div>

    <section class="trv-countries" aria-labelledby="trv-countries-title">
      <h2 class="trv-countries__title" id="trv-countries-title">Countries</h2>
      <ol class="trv-list" data-travel-list></ol>
    </section>

  </div>

  <noscript>
    <p class="trv-noscript mono">The globe and the country list need JavaScript turned on.</p>
  </noscript>
</main>

<footer class="site-footer">
  <p class="mono">&copy; Joseph Kerby Anderson, <span data-year>2026</span>. All Rights Reserved.</p>
</footer>

<!-- d3-geo needs d3-array loaded first: its UMD build looks for it on the
     global `d3`. Neither is used anywhere else on the site. -->
<script defer src="/js/vendor/d3-array.min.js"></script>
<script defer src="/js/vendor/d3-geo.min.js"></script>
<script defer src="/js/vendor/topojson-client.min.js"></script>
<script defer src="/js/travel-data.js"></script>
<script defer src="/js/travel.js"></script>
<script defer src="/js/site.js"></script>
</body>
</html>
